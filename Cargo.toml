[package]
name = "mini-redis"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
lru = "0.18.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
criterion = "0.8.2"
tokio-test = "0.4.6"
# Project manifest to complete yourself.
# Add these runtime dependencies and enable only the features you need:
# - tokio: async runtime, TCP, tasks, locks, timers, and macros.
# - bytes: efficient byte buffers and binary-safe values.
# - clap: typed command-line configuration.
# - lru: the V1 least-recently-used eviction policy.
# - tracing: structured application logging.
# - tracing-subscriber: formatting and filtering those logs.
#
# Add dashmap later for the optional V2 sharded-store comparison.
# Add criterion and tokio-test as development dependencies when you reach
# benchmarking and focused asynchronous tests.